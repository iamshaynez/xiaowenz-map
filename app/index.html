<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>像素杭州</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #1c1b19; --muted: #8b877f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #fff; color: var(--ink); }
  body { font: 13px/1.35 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; cursor: grab; outline: none; }
  canvas:active { cursor: grabbing; }
  #readout { position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); color: var(--muted); pointer-events: none; font-variant-numeric: tabular-nums; }
  #hint { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); color: var(--muted); pointer-events: none; text-align: right; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" tabindex="0" aria-label="像素杭州：可以旋转、缩放的主城区立体地图"></canvas></div>
<div id="readout"></div>
<div id="hint">拖动 旋转 / 俯仰 · 滚轮或双指 缩放 · WASD / 方向键 平移 · R 回到全景</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
