[project]
name = "pixelcity-pipeline"
version = "0.2.0"
description = "像素城市的数据管线：开放地理数据 -> 一座城的瓦片；cities/<id>/city.json 说的是哪座城"
requires-python = ">=3.12"
dependencies = ["osmium>=4", "shapely>=2", "numpy>=2", "pyproj>=3", "pyshp>=3", "tifffile>=2024", "imagecodecs>=2024"]

[tool.setuptools]
packages = ["pixelcity"]
